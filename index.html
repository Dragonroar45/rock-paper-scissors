<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="main-container">
        <div class="nav-bar">
            <div class="logo"><span class="logo-img"><img src="https://files.catbox.moe/oxzjf6.png" alt="A bunch of hands in form of rock paper and scissors" width="60px"></span><span class="logo-text">ROCK PAPER SCISSORS</span></div>
            <ul class="nav-list">
                <!-- <div class="nav-item1"><li><a href="./index.html">Home</a></li></div> -->
                <div class="nav-item2"><li><a href="./info.html">Info</a></li></div>
            </ul>
        </div>
        <div class="info-text">
            <p class="info-main">Before you start playing, click on the Info button above to learn about the different power ups in the game!</p>
        </div>
        <div class="choices-powerups">
            <div class="round"> Rounds: <span class="round-no"></span></div>
            <p class="result"></p>
            <div class="scores">Human Score: <span class="human-score"></span> Computer Score: <span class="computer-score"></span></div>
            <div class="choices-imgs">
                <div class="choice-img1"><img src="https://files.catbox.moe/aghspv.png" alt="A black sketch of a fist" width="150px" class="choice-img"></div>
                <div class="choice-img2"><img src="https://files.catbox.moe/q17x68.png" alt="A black sketch of a palm" width="150px" class="choice-img"></div>
                <div class="choice-img3"><img src="https://files.catbox.moe/03uz89.png" alt="A black sketch of a hand with scissors pose" width="150px" class="choice-img"></div>
            </div>
            <div class="power-ups">
                <div class="powerups-imgs">
                    <div class="powerup-text">Power Up</div>
                    <div class="power-img1"><img src="https://files.catbox.moe/dm8vw4.png" alt="A black sketch of an eye" width="150px" class="img-eye"></div>
                </div>
            </div>
            <p class="information">The Power Up system is currently a work in progress. More power ups would be added soon.</p>
        </div>
    </div>
</body>
</html>
