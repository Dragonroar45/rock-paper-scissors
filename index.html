<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="main-container">
        <div class="nav-bar">
            <div class="logo"><span class="logo-img"><img src="imgs/rock-paper-scissors-color.png" alt="A bunch of hands in form of rock paper and scissors" width="60px"></span><span class="logo-text">ROCK PAPER SCISSORS</span></div>
            <ul class="nav-list">
                <li>Home</li>
                <li>Info</li>
            </ul>
        </div>
        <div class="choices-powerups">
            <p></p>
            <div class="choices-imgs">
                <div class="choice-img1"><img src="imgs/fist.png" alt="A black sketch of a fist" width="100px"></div>
                <div class="choice-img2"><img src="imgs/hand-paper.png" alt="A black sketch of a palm" width="100px"></div>
                <div class="choice-img3"><img src="imgs/scissors.png" alt="A black sketch of a hand with scissors pose" width="100px"></div>
            </div>
            <div class="power-ups">
                <div class="powerups-imgs">
                    <div class="powerup-text">Power Up</div>
                    <div class="power-img1"><img src="imgs/eye.png" alt="A black sketch of an eye" width="100px"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
